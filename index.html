<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 台帳アプリと同じ見た目の系統。手袋でも押せる大きさ。
   色：飼料袋のクラフト #d9a441、牛舎の焦げ茶 #23201b、注意の赤 #c8402a、良しの緑。 */
:root{color-scheme:light dark;--bg:light-dark(#f3f0e8,#141312);--card:light-dark(#fffdf8,#1f1d1a);--ink:light-dark(#1d1b17,#efebe3);--mute:light-dark(#625c52,#a59e92);--line:light-dark(#dcd5c6,#37332d);--kraft:#d9a441;--kink:#1d1a10;--head:#23201b;--acc:#c8402a;--ok:light-dark(#2f6b45,#7cc495);--warnbg:light-dark(#fbe4dc,#3a1f19)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
header{background:var(--head);color:#f3efe6;padding:14px max(4vw,14px)}
.hrow{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.hrow h1{font:800 20px/1.15 "M PLUS 1p",sans-serif;margin:0;flex:1}
.hrow h1 small{display:block;font:500 13px/1.3 "Noto Sans JP",sans-serif;color:#cfc8ba}
.hrow a{color:#f3efe6;font-size:15px;text-decoration:none;padding:10px 4px}
main{max-width:760px;margin:0 auto;padding:12px max(4vw,14px) 90px}
h2{font:800 18px/1.3 "M PLUS 1p",sans-serif;margin:22px 0 8px}
h3{font:800 16px/1.3 "M PLUS 1p",sans-serif;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px;color:inherit;text-decoration:none}
.row .t{flex:1;font-size:14px;color:var(--mute)}.row .t b{color:var(--ink);font-size:16px}
.row .v{flex:none;text-align:right;font-size:13px;color:var(--mute)}.row .v b{display:block;font:800 18px/1.1 "M PLUS 1p",sans-serif;color:var(--ink)}
.st{flex:none;font:800 13px/1 "Noto Sans JP",sans-serif;border-radius:8px;padding:7px 8px}
.st.ng{background:var(--acc);color:#fff}.st.ok{background:light-dark(#dcebdf,#1f3a29);color:var(--ok)}.st.no{background:var(--line);color:var(--mute)}
.btn{flex:none;font:700 15px/1.1 "Noto Sans JP",sans-serif;padding:12px 14px;min-height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:light-dark(#23201b,#d9a441);color:light-dark(#f3efe6,#1d1a10);border-color:transparent}
.btn.kr{background:var(--kraft);color:var(--kink);border-color:transparent}
.btn.big{width:100%;min-height:62px;font-size:19px;border-radius:16px}
.btn.warn{color:var(--acc);border-color:var(--acc)}
.btn.sm{min-height:38px;padding:8px 11px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.alerts{display:grid;gap:6px;margin-top:4px}
.alert{background:var(--warnbg);border-left:6px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:15px;color:inherit;text-decoration:none;display:block}
.alert b{color:var(--acc)}
.okbar{background:light-dark(#dcebdf,#1f3a29);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:4px}
.empty,.small{color:var(--mute);font-size:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;margin:8px 0}
.facts dt{color:var(--mute)}.facts dd{margin:0;font-weight:700}
.adv{font:800 26px/1.1 "M PLUS 1p",sans-serif;margin:6px 0}
.adv small{font:500 14px "Noto Sans JP",sans-serif;color:var(--mute)}
.gauge{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.gauge i{display:block;height:100%;background:var(--kraft)}
.gauge i.lo{background:var(--acc)}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.red{color:var(--acc);font-weight:700}
label.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
input.num{font:800 30px/1 "M PLUS 1p",sans-serif;text-align:right;background:var(--kraft);color:var(--kink);border:0}
.inrow{display:flex;gap:8px;align-items:center}.inrow>span{flex:none;font-weight:700}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative;width:104px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.th img{display:block;width:100%;height:78px;object-fit:cover;cursor:pointer}
.th .cnt{position:absolute;left:4px;top:4px;background:var(--kraft);color:var(--kink);font:800 14px/1 "M PLUS 1p",sans-serif;padding:4px 6px;border-radius:6px}
.th button{width:100%;border:0;background:var(--card);color:var(--ink);font:700 13px "Noto Sans JP";padding:8px 0;cursor:pointer}
.hist{display:grid;gap:8px}
.hrec{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.hrec img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;flex:none}
.hrec .t{flex:1;font-size:14px}.hrec .t b{font-size:16px}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:8px;margin-top:6px}
.rule .w{grid-column:1/-1}
details{margin-top:14px}summary{cursor:pointer;font-weight:700;padding:8px 0}
table.calc{width:100%;border-collapse:collapse;font-size:14px}table.calc td{padding:4px 2px;border-bottom:1px solid var(--line)}table.calc td:last-child{text-align:right;font-weight:700}
/* 写真を全画面で見る・数える */
.ov{position:fixed;inset:0;background:#0d0c0b;color:#f3efe6;z-index:50;display:flex;flex-direction:column}
.ovbar{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap;background:#23201b}
.ovbar .n{font:800 30px/1 "M PLUS 1p",sans-serif;color:var(--kraft);margin-right:auto}
.ovbar .n small{font-size:15px;color:#f3efe6}
.ovbar .btn{background:#34302a;color:#f3efe6;border-color:#4a443b}
.ovbar .btn.kr{background:var(--kraft);color:var(--kink)}
.ovwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.ovwrap canvas{display:block;width:100%}
.ovhint{padding:8px 12px;font-size:14px;background:#23201b;color:#e6dfd2}
.ovhint input[type=range]{width:100%;min-height:30px;padding:0}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .card{width:min(760px,100%);border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:92vh;overflow:auto}
.tabs{display:flex;gap:6px;margin:4px 0 2px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.tabs a{flex:1;text-align:center;font:800 16px/1 "M PLUS 1p",sans-serif;padding:13px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.tabs a.on{background:var(--head);color:#f3efe6;border-color:transparent}
.st.wa{background:light-dark(#fbe7c2,#4a3613);color:light-dark(#7a4b00,#f2c66d)}.st.bl{background:light-dark(#dde6f3,#1d2a3c);color:light-dark(#2b4f80,#9cbbe6)}
.sub{font:700 14px/1.3 "Noto Sans JP",sans-serif;color:var(--mute);margin:14px 2px 4px}
.step{display:flex;gap:8px;align-items:center}.step .btn{min-width:56px;font-size:22px}
pre.memo{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:15px/1.6 "Noto Sans JP",sans-serif;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23201b;color:#f3efe6;padding:12px 18px;border-radius:24px;z-index:60;font-weight:700;box-shadow:0 4px 16px rgb(0 0 0/.3)}
</style></head><body>
<header><div class="hrow"><h1 id="ttl">在庫チェック<small id="sub"></small></h1><a href="#home" id="hb">一覧</a><a href="#order">注文メモ</a><a href="#data">データ</a></div></header>
<main id="app"></main>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="lib" accept="image/*" multiple hidden>
<input type="file" id="xf" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<script>
'use strict';
/* ===== 基本 ===== */
const KEY='zaiko-v1',DKEY='pocket-daicho-v1',DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const t0=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const md=d=>{d=new Date(d);return(d.getMonth()+1)+'/'+d.getDate()+'('+'日月火水木金土'[d.getDay()]+')'};
const hm=d=>{d=new Date(d);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const dt=d=>ymd(d)+' '+hm(d);
const days=(a,b)=>Math.round((t0(b)-t0(a))/DAY);
const nf=(n,u)=>n==null||!isFinite(n)?'—':(u==='袋'?(Math.round(n*10)/10).toLocaleString('ja-JP'):Math.round(n).toLocaleString('ja-JP'));
const ago=at=>{const d=days(at,Date.now());return d<=0?'今日 '+hm(at):d===1?'昨日':d+'日前'};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
const numOr=(v,d=null)=>{if(v===''||v==null)return d;const n=Number(String(v).replace(/,/g,''));return isFinite(n)?n:d};

/* ===== 初期の品目（数字は牛舎マップの引き継ぎ・相談で決まったもの。違えば「設定」で直す） ===== */
function defaults(){return{v:1,
 items:[
  {id:'s1',name:'成雌 1番タンク（東）',feed:'ベストクイーン',kind:'tank',unit:'kg',cap:2000,capNom:2000,capMax:2500,lv:[{label:'円筒の上の端（満タン・計算）',kg:2400},{label:'上の窓の下の端（前任の実績）',kg:1500},{label:'円すいと円筒のつなぎ目（計算）',kg:640},{label:'円すいの高さの半分（計算）',kg:80},{label:'空',kg:0}],grp:'seishi',active:true,every:7,needPhoto:true,useMode:'calc',manual:null,rules:[{t:'plan',barn:'成雌牛舎',pens:'A,B'}],note:'成雌A・B房'},
  {id:'s2',name:'成雌 2番タンク（西）',feed:'ベストクイーン',kind:'tank',unit:'kg',cap:2000,capNom:2000,capMax:2500,lv:[{label:'円筒の上の端（満タン・計算）',kg:2400},{label:'上の窓の下の端（前任の実績）',kg:1500},{label:'円すいと円筒のつなぎ目（計算）',kg:640},{label:'円すいの高さの半分（計算）',kg:80},{label:'空',kg:0}],grp:'seishi',active:true,every:7,needPhoto:true,useMode:'calc',manual:null,rules:[{t:'plan',barn:'成雌牛舎',pens:'C,D'}],note:'成雌C・D房。1番と同じ型かは未確認（銘板で確かめる）'},
  {id:'sg',name:'総合タンク',feed:'北の匠育成K（バラ）',kind:'tank',unit:'kg',cap:3000,grp:'sogo',active:true,every:7,needPhoto:true,useMode:'calc',manual:82,rules:[{t:'head',barn:'総合牛舎',pens:'A,B,D,育成房',kg:4},{t:'head',barn:'総合牛舎',pens:'C',kg:4.48},{t:'head',barn:'黒毛ドナー牛舎',pens:'Di',kg:2}],note:'総合単房の2頭はタンクから食べない。ドナーDiはタルで運ぶ'},
  {id:'i1',name:'育成 ①東タンク',feed:'北の匠育成K（バラ）',kind:'tank',unit:'kg',cap:null,grp:'ikusei',active:false,every:7,needPhoto:true,useMode:'calc',manual:null,rules:[{t:'head',barn:'育成牛舎',pens:'A,B',kg:null}],note:'育成A・B房。フィーダー完成（12月初め予定）から使う'},
  {id:'i2',name:'育成 ②西タンク',feed:'北の匠育成K（バラ）',kind:'tank',unit:'kg',cap:null,grp:'ikusei',active:false,every:7,needPhoto:true,useMode:'calc',manual:null,rules:[{t:'head',barn:'育成牛舎',pens:'C,D',kg:null}],note:'育成C・D房。フィーダー完成から使う'},
  {id:'kb',name:'北の匠（20kg袋）',feed:'北の匠',kind:'bag',unit:'袋',kgPer:20,cap:null,grp:'kb',active:true,every:7,needPhoto:true,useMode:'calc',manual:null,rules:[{t:'fixed',kg:40,label:'育成E房（1日2袋）'}],note:'牛舎内にいるプランありの成雌は1頭2kg/日。いる房を「1頭あたり」の行で足す'},
  {id:'mf',name:'ミルフードBフレーク',feed:'子牛の離乳食',kind:'bag',unit:'袋',kgPer:null,cap:null,grp:'mf',active:true,every:7,needPhoto:true,useMode:'manual',manual:null,rules:[],note:'1日の使用量（袋）を入れると目安が出る'}
 ],
 grps:[
  {id:'seishi',name:'成雌（ベストクイーン）',unit:500,interval:7,lead:14,next:'',safety:1,orders:[]},
  {id:'sogo',name:'総合（北の匠育成K）',unit:500,interval:7,lead:14,next:'',safety:1,orders:[]},
  {id:'ikusei',name:'育成（北の匠育成K）',unit:500,interval:7,lead:14,next:'',safety:1,orders:[]},
  {id:'kb',name:'北の匠（袋）',unit:1,interval:7,lead:7,next:'',safety:2,orders:[]},
  {id:'mf',name:'ミルフードBフレーク',unit:1,interval:7,lead:7,next:'',safety:2,orders:[]}
 ],
 checks:[],cfg:{who:'',planKg:{A:null,B:null,C:null}}}}
let db;
function load(){try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){db=null}if(!db||!db.items)db=defaults();db.checks??=[];db.cfg??={who:'',planKg:{}};db.cfg.planKg??={};
 if((db.v||1)<2){for(const id of['s1','s2']){const it=db.items.find(i=>i.id===id);if(it&&it.capMax==null){it.capNom=2000;it.capMax=2500;it.cap=2000;it.lv=it.lv||[{label:'円筒の上の端（満タン・計算）',kg:2400},{label:'上の窓の下の端（前任の実績）',kg:1500},{label:'円すいと円筒のつなぎ目（計算）',kg:640},{label:'円すいの高さの半分（計算）',kg:80},{label:'空',kg:0}]}}db.v=2;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
 fixup()}
/* v3：餌・雑貨・薬品をまとめて。今までの品目は「餌」。牛舎マップの定期発注品の名前（xl）でつなぐ */
const XLNAME={kb:'北の匠育成K（紙袋20kg）',mf:'ミルフードBフレーク（紙袋20kg）'};
function fixup(){let ch=false;for(const it of db.items){if(!it.cat){it.cat='feed';ch=true}if(!it.kind)it.kind=it.unit==='袋'?'bag':'tank';if(it.xl==null&&XLNAME[it.id]){it.xl=XLNAME[it.id];ch=true}}
 db.cfg.tab??='all';db.xlNext??=null;if((db.v||1)<3){db.v=3;ch=true}if(ch)try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const CATS={feed:'餌',goods:'雑貨',med:'薬品'};
const catOf=it=>it.cat||'feed';
const isSimple=it=>it.kind==='simple';
/* 牛舎マップの「区分」→ アプリの分類。衛生・治療（注射針・シリンジ・手袋など）は薬品のタブに入れる（品目の設定で変えられる） */
function catFromSub(b){b=String(b||'');if(/^餌|補助飼料|鉱塩|飼料/.test(b))return'feed';if(/医薬|薬|衛生|治療/.test(b))return'med';return'goods'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('保存できませんでした：'+e.message)}}
load();
const itemOf=id=>db.items.find(i=>i.id===id);
const grpOf=id=>db.grps.find(g=>g.id===id);
const checksOf=id=>db.checks.filter(c=>c.item===id).sort((a,b)=>a.at-b.at);
const lastOf=id=>checksOf(id).pop()||null;

/* ===== 写真の保存（IndexedDB。localStorageには入りきらないため） ===== */
let idbP;
function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open('zaiko-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'pid'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p',mode);const st=t.objectStore('p');let out;const q=fn(st);if(q)q.onsuccess=()=>out=q.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
const pPut=o=>tx('readwrite',s=>s.put(o));
const pGet=pid=>tx('readonly',s=>s.get(pid));
const pDel=pid=>tx('readwrite',s=>s.delete(pid));
const pKeys=()=>tx('readonly',s=>s.getAllKeys());
const urlCache={};
async function purl(pid){if(urlCache[pid])return urlCache[pid];const o=await pGet(pid);if(!o)return null;return urlCache[pid]=URL.createObjectURL(o.blob)}
async function fillImgs(root=document){for(const im of root.querySelectorAll('img[data-pid]')){const u=await purl(im.dataset.pid);if(u)im.src=u;else{im.alt='（写真は消去済み）';im.style.background='#555'}}}

/* 写真を撮る → 縮小 → 下に日時・品目・担当の帯を焼き込む（証拠用） */
async function makePhoto(file,it,o={}){
 const bmp=await createImageBitmap(file);
 const M=1600,s=Math.min(1,M/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
 const bh=o.noBand?0:Math.max(36,Math.round(w*0.045));
 const at=o.picked&&file.lastModified?file.lastModified:(file.lastModified&&Math.abs(Date.now()-file.lastModified)<15*60e3)?file.lastModified:Date.now();
 const cv=document.createElement('canvas');cv.width=w;cv.height=h+bh;const x=cv.getContext('2d');
 x.drawImage(bmp,0,0,w,h);x.fillStyle='#23201b';x.fillRect(0,h,w,bh);
 x.fillStyle='#d9a441';x.font=`800 ${Math.round(bh*.5)}px "M PLUS 1p",sans-serif`;x.textBaseline='middle';
 if(bh)x.fillText(`${dt(at)}  ${it.name}${db.cfg.who?'  '+db.cfg.who:''}${o.picked?'  ※あとから追加':''}`,Math.round(bh*.3),h+bh/2);
 const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));
 const pid=uid();await pPut({pid,blob,w,h,at,item:it.id,saved:Date.now()});
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 return{pid,w,h,at,marks:[]}}

/* 写真の入れ方：撮る(cam)・選ぶ(lib)・貼り付け(paste)。PCではCtrl+Vでも貼れる */
let PASTE=null;
document.addEventListener('paste',e=>{if(!PASTE)return;const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();PASTE(fs,'paste')}});
function getPhotos(mode){return new Promise(async res=>{
 if(mode==='paste'){try{if(!navigator.clipboard?.read)throw new Error('このブラウザはボタンでの貼り付けに対応していません');const items=await navigator.clipboard.read();const fs=[];
   for(const ci of items){const t=ci.types.find(x=>x.startsWith('image/'));if(t){const b=await ci.getType(t);fs.push(new File([b],'paste.png',{type:t}))}}
   if(!fs.length)alert('コピーした写真がありません。写真を長押し →「コピー」してから押してください。');res(fs)}
  catch(e){alert('貼り付けできませんでした（'+e.message+'）。「写真を選ぶ」を使ってください。');res([])}return}

/* ===== 台帳アプリのデータを読む（読むだけ。書き込まない） ===== */
function daicho(){try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(!d||!d.cows)return null;
 const last={};for(const e of d.events||[])if(e.type==='移動'&&(!last[e.tag]||e.date>=last[e.tag].date))last[e.tag]=e;
 const cows=[];for(const[t,c]of Object.entries(d.cows)){if(c.gone)continue;const l=last[t]||{barn:c.barn,pen:c.pen};if(!l.barn)continue;cows.push({tag:t,barn:l.barn,pen:String(l.pen||''),plan:c.plan})}
 return{cows,n:Object.keys(d.cows).length}}catch(e){return null}}
let DC=null;
const pensOf=s=>String(s||'').split(/[,、，\s]+/).filter(Boolean);
const planL=p=>(String(p||'').toUpperCase().match(/[A-Z]/)||[])[0]||'';

/* 1日の使用量（計算）：台帳の頭数 × 1頭あたり、またはプランの1日量 */
function calcUse(it){
 if(!it.rules||!it.rules.length)return null;
 const rows=[];let kg=0,ok=true;
 for(const r of it.rules){
  if(r.t==='fixed'){const v=numOr(r.kg);rows.push({label:r.label||'決まった量',n:null,kg:v});if(v==null)ok=false;else kg+=v;continue}
  if(!DC){ok=false;rows.push({label:`${r.barn} ${r.pens}（台帳のデータが無い）`,n:null,kg:null});continue}
  const ps=pensOf(r.pens);const cs=DC.cows.filter(c=>c.barn===r.barn&&ps.includes(c.pen));
  if(r.t==='head'){const per=numOr(r.kg);const v=per==null?null:cs.length*per;rows.push({label:`${r.barn} ${r.pens}：${cs.length}頭 × ${per??'?'}kg`,n:cs.length,kg:v});if(v==null)ok=false;else kg+=v}
  else if(r.t==='plan'){const by={};for(const c of cs){const L=planL(c.plan);if(L)by[L]=(by[L]||0)+1}
   const none=cs.filter(c=>!planL(c.plan)).length;
   for(const L of Object.keys(by).sort()){const per=numOr(db.cfg.planKg[L]);const v=per==null?null:by[L]*per;rows.push({label:`${r.barn} ${r.pens} プラン${L}：${by[L]}頭 × ${per??'?'}kg`,n:by[L],kg:v});if(v==null)ok=false;else kg+=v}
   if(none)rows.push({label:`${r.barn} ${r.pens} プランなし：${none}頭（0kgとして計算）`,n:none,kg:0});
   if(!cs.length)rows.push({label:`${r.barn} ${r.pens}：0頭`,n:0,kg:0})}}
 let v=ok?kg:null;if(v!=null&&it.unit==='袋'){const per=numOr(it.kgPer);v=per?kg/per:null;if(!per)ok=false}
 return{v,ok:v!=null,rows,kg}}
/* 1日の使用量（実測）：チェックの残量の差から。間に納品があった区間は使わない */
function measUse(it){const cs=checksOf(it.id);const g=grpOf(it.grp);const od=(g?.orders||[]).map(o=>o.dd);
 let used=0,dd=0;const lim=Date.now()-35*DAY;
 for(let k=1;k<cs.length;k++){const a=cs[k-1],b=cs[k];if(b.at<lim)continue;const span=(b.at-a.at)/DAY;if(span<.5)continue;
  if(od.some(d=>d>ymd(a.at)&&d<=ymd(b.at)))continue;const dr=a.val-b.val;if(dr<0)continue;used+=dr;dd+=span}
 return dd>=1?used/dd:null}
function useOf(it){const c=calcUse(it),m=measUse(it),man=numOr(it.manual);
 const pick={calc:[c?.ok?c.v:null,'計算'],manual:[man,'入力'],meas:[m,'実測']};
 const order=it.useMode==='manual'?['manual','calc','meas']:it.useMode==='meas'?['meas','calc','manual']:['calc','manual','meas'];
 for(const k of order){const[v,l]=pick[k];if(v!=null)return{v,src:l,c,m,man,want:k}}
 return{v:null,src:'',c,m,man}}

/* ===== 雑貨・薬品・定期の袋もの（数える＋頼んだ＋届いた。計算はしない） ===== */
function sState(it){const l=lastOf(it.id);const now=t0(Date.now()).getTime();const st={it,l,stock:l?l.val:null};
 const pend=(it.orders||[]).filter(o=>!o.got);st.pend=pend;
 if(it.lastOrd&&numOr(it.ivl)!=null){st.next=pd(it.lastOrd).getTime()+numOr(it.ivl)*DAY;st.toNext=Math.round((st.next-now)/DAY)}
 st.low=numOr(it.min)!=null&&st.stock!=null&&st.stock<=numOr(it.min);
 const ex=l&&l.exp?pd(l.exp).getTime():null;if(ex!=null){st.exp=ex;st.toExp=Math.round((ex-now)/DAY)}
 st.late=pend.filter(o=>o.eta&&pd(o.eta).getTime()<now);
 // 表示の札（いちばん大事なもの1つ）
 if(st.toExp!=null&&st.toExp<0)st.chip=['ng','期限切れ'];
 else if(st.low&&!pend.length)st.chip=['ng','少ない'];
 else if(st.toNext!=null&&st.toNext<0&&!pend.length)st.chip=['ng','過ぎた'];
 else if(pend.length)st.chip=['bl','注文済み'];
 else if(st.toExp!=null&&st.toExp<=30)st.chip=['wa','期限近い'];
 else if(st.toNext!=null&&st.toNext<=14)st.chip=['wa','2週間'];
 else if(st.stock==null)st.chip=['no','未'];
 else st.chip=['ok','OK'];
 st.need=!pend.length&&(st.low||(st.toNext!=null&&st.toNext<=14));
 return st}

/* ===== 注文の目安 ===== */
function grpState(g){
 const its=db.items.filter(i=>i.grp===g.id&&i.active);if(!its.length)return null;
 const unit=its[0].unit;const L=its.map(i=>({it:i,last:lastOf(i.id),u:useOf(i)}));
 const missing=L.filter(x=>!x.last).map(x=>x.it.name);const noUse=L.filter(x=>x.u.v==null).map(x=>x.it.name);
 const cap=L.every(x=>numOr(x.it.cap)!=null)?L.reduce((a,x)=>a+numOr(x.it.cap),0):null;
 const st={g,its,L,unit,missing,noUse,cap};
 if(missing.length||noUse.length)return st;
 const U=L.reduce((a,x)=>a+x.u.v,0);const latest=Math.max(...L.map(x=>x.last.at));const lday=ymd(latest);
 const ords=(g.orders||[]).filter(o=>o.dd>lday);
 const P=t=>L.reduce((a,x)=>a+x.last.val-x.u.v*Math.max(0,(t-x.last.at)/DAY),0)+ords.filter(o=>pd(o.dd)<t).reduce((a,o)=>a+numOr(o.qty,0),0);
 Object.assign(st,{U,P,now:P(Date.now()),ords});
 // 空になる日（注文済みの納品も入れて）
 if(U>0){let t=t0(Date.now()).getTime();for(let k=0;k<120;k++){t+=DAY;if(P(t)<=0){st.empty=t;break}}}
 // 次に注文する納品日
 if(g.next){const T=t0(Date.now()).getTime();let D=pd(g.next).getTime();const iv=Math.max(1,numOr(g.interval,7))*DAY,lead=numOr(g.lead,14)*DAY;
  let k=0;const skipped=[];while((D-lead<T||(g.orders||[]).some(o=>o.dd===ymd(D)))&&k++<200){if(D>=T&&!(g.orders||[]).some(o=>o.dd===ymd(D)))skipped.push(D);D+=iv}st.skipped=skipped;
  const PD=P(D);const need=U*(numOr(g.interval,7)+numOr(g.safety,0))-Math.max(0,PD);const u=Math.max(1,numOr(g.unit,1));
  let q=need<=0?0:Math.ceil(need/u-1e-9)*u;let capped=false;
  if(cap!=null){const mx=Math.floor((cap-Math.max(0,PD))/u)*u;if(q>mx){q=Math.max(0,mx);capped=true}}
  Object.assign(st,{D,deadline:D-lead,PD,q,capped,toDL:days(Date.now(),D-lead)})}
 return st}

function warnings(){const W=[];const now=Date.now();
 for(const it of db.items.filter(i=>i.active&&isSimple(i))){const s=sState(it);const h='#i-'+it.id;
  if(s.toExp!=null&&s.toExp<=30)W.push({it,href:h,kind:'期限',txt:`<b>${s.toExp<0?'使用期限が切れています':`使用期限まで${s.toExp}日`}</b>：${esc(it.name)}（${md(s.exp)}）`});
  if(s.low&&!s.pend.length)W.push({it,href:h,kind:'少ない',txt:`<b>残りが少ない</b>：${esc(it.name)}（${nf(s.stock,'袋')} ${esc(it.unit)}・${nf(numOr(it.min),'袋')}以下）`});
  else if(s.toNext!=null&&s.toNext<0&&!s.pend.length)W.push({it,href:h,kind:'目安',txt:`<b>頼む目安を${-s.toNext}日過ぎた</b>：${esc(it.name)}（前回 ${md(pd(it.lastOrd))}）`});
  for(const o of s.late)W.push({it,href:h,kind:'入荷',txt:`<b>入荷予定日を過ぎた</b>：${esc(it.name)} ${nf(o.qty,'袋')}${esc(it.unit)}（${md(pd(o.eta))}予定）。届いていたら「届いた」を押す`});
  const ev=numOr(it.every);if(ev!=null){const l=s.l;if(!l||days(l.at,now)>ev)W.push({it,href:'#chk-'+it.id,kind:'未チェック',txt:`<b>${l?days(l.at,now)+'日数えていません':'まだ数えていません'}</b>：${esc(it.name)}（${ev}日ごと）`})}}
 for(const it of db.items.filter(i=>i.active&&!isSimple(i))){const l=lastOf(it.id);const ev=numOr(it.every,7);
  if(!l)W.push({it,kind:'未チェック',txt:`<b>まだチェックしていません</b>：${esc(it.name)}`});
  else if(days(l.at,now)>ev)W.push({it,kind:'未チェック',txt:`<b>${days(l.at,now)}日チェックしていません</b>：${esc(it.name)}（${ev}日ごとの決まり）`});
  else if(it.needPhoto&&!(l.photos||[]).length)W.push({it,kind:'写真なし',txt:`<b>写真がありません</b>：${esc(it.name)}（${md(l.at)}のチェック）`})}
 for(const g of db.grps){const s=grpState(g);if(!s||s.toDL==null)continue;
  if(s.toDL<=2){const old=s.L.filter(x=>!x.last||x.last.at<s.deadline-3*DAY);
   for(const x of old)if(!W.some(w=>w.it===x.it&&w.kind==='未チェック'))W.push({it:x.it,kind:'注文前',txt:`<b>注文の前にチェック</b>：${esc(x.it.name)}（締切 ${md(s.deadline)}）`})}
  if(s.empty&&s.D&&s.empty<s.D)W.push({it:s.its[0],kind:'不足',txt:`<b>${md(s.empty)}ごろ空になる見込み</b>：${esc(g.name)}（次の納品 ${md(s.D)} より前）`})}
 return W}

let CT=null;
async function openCount(p,done){const o=await pGet(p.pid);if(!o)return alert('写真が見つかりません');const bmp=await createImageBitmap(o.blob);
 CT={p,bmp,w:p.w,h:p.h,marks:(p.marks||[]).map(m=>[...m]),mode:'tap',zoom:1,thr:62,ncc:null,rect:null,done};
 const ov=document.createElement('div');ov.className='ov';ov.id='cov';ov.innerHTML=`<div class="ovbar"><span class="n" id="cn">0<small> 個</small></span>
  <button class="btn kr" id="auto">見本を囲んで自動</button><button class="btn" id="zm">拡大</button><button class="btn" id="clr">全部消す</button><button class="btn kr" id="fin">決定</button></div>
  <div class="ovhint" id="hint"></div><div class="ovwrap" id="cw"><canvas id="cc"></canvas></div>`;

  else h.innerHTML='袋を<b>1つずつタップ</b>（もう一度タップで消す）。たくさんあるときは「見本を囲んで自動」。';
  const t=h.querySelector('#thr');if(t)t.oninput=()=>{CT.thr=+t.value;pick();draw()}};
 const draw=()=>{const x=cv.getContext('2d');x.drawImage(bmp,0,0);drawMarks(x,CT.marks,1,CT.w,CT.h);
  if(CT.rect){x.strokeStyle='#4fc3f7';x.lineWidth=Math.max(3,CT.w/300);x.setLineDash([12,8]);x.strokeRect(CT.rect.x,CT.rect.y,CT.rect.w,CT.rect.h);x.setLineDash([])}

function runAuto(){const r=CT.rect;const h=$('#hint');h.textContent='かぞえています…';
 setTimeout(()=>{const W=CT.w,H=CT.h;let s=24/Math.max(r.w,r.h);const maxPix=640*640;if(W*s*H*s>maxPix)s=Math.sqrt(maxPix/(W*H));
  const sw=Math.max(8,Math.round(W*s)),sh=Math.max(8,Math.round(H*s));
  const c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(CT.bmp,0,0,W,H,0,0,sw,sh);

  const tx=Math.round(r.x*s),ty=Math.round(r.y*s),tw=Math.max(4,Math.min(sw-tx,Math.round(r.w*s))),th=Math.max(4,Math.min(sh-ty,Math.round(r.h*s)));

  if(tn<1){CT.rect=null;CT.redraw();h.textContent='囲んだところに模様が無く、比べられません。袋の縁や文字が入るように囲み直してください。';return}
  const S=new Float64Array((sw+1)*(sh+1)),S2=new Float64Array((sw+1)*(sh+1));

  const ow=sw-tw+1,oh=sh-th+1;const step=ow*oh*n>6e7?2:1;const R=new Float32Array(ow*oh).fill(-1);

   const sm=S[i3]-S[i1]-S[i2]+S[i0],sq=S2[i3]-S2[i1]-S2[i2]+S2[i0];const vr=sq-sm*sm/n;if(vr<1e-3)continue;

function pick(){const{R,ow,oh,step,tw,th,s}=CT.ncc;const thr=CT.thr/100;const cand=[];
 for(let y=0;y<oh;y+=step)for(let x=0;x<ow;x+=step){const v=R[y*ow+x];if(v>=thr)cand.push([v,x,y])}
 cand.sort((a,b)=>b[0]-a[0]);if(cand.length>30000)cand.length=30000;const keep=[];

  if(f.meth===0)return dec.decode(data);if(f.meth!==8)throw new Error('この圧縮は読めません');

  save();m.remove();toast(`取り込みました（足した ${add.length}・更新 ${upd.length}）`);if(setN.length)setTimeout(()=>toast('次の納品日を '+md(pd(nx.dd.find(Boolean)))+' にしました'),2300);location.hash='#home';route()}}

function csv(rows){return'﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function dl(data,name,type){const b=data instanceof Blob?data:new Blob([data],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
/* ZIP（圧縮なし。写真はもともと圧縮済み） */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name);const crc=crc32(f.data);const d=f.date||new Date();const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,tm,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,f.data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,tm,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(c.buffer,nm);off+=30+nm.length+f.data.length}
 const cs=cen.reduce((a,b)=>a+b.byteLength,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
